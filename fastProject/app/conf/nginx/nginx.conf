
worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream api{
        server localhost:1111;
        server localhost:2222;
    }

    gzip on;
    gzip_types application/javascript
    gzip_comp_level 6;

    server {
        listen       8080;
        server_name  localhost;

        location / {
             root /Users/diasmuratbayev/Documents/Projects/Python/fastProject/app/conf/nginx_video/;
             index main.html;
            #return 301 https://google.com;

        }
        location /api{
            proxy_pass http://api/;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    include servers/*;
}
